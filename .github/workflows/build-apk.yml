name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build VDOSKy Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Start.io SDK & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          # Ensure Android permissions for Start.io advertising ID, network, and audio
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "com.startapp.sdk.APPLICATION_ID" "$MANIFEST"; then
              sed -i 's/<application/<application android:hardwareAccelerated="true" android:usesCleartextTraffic="true"/g' "$MANIFEST"
              sed -i '/<application[^>]*>/a \        <!-- Start.io Official Ad Network Credentials -->\n        <meta-data android:name="com.startapp.sdk.APPLICATION_ID" android:value="203877183" \/>\n        <meta-data android:name="com.startapp.sdk.RETURN_ADS_ENABLED" android:value="false" \/>' "$MANIFEST"
            fi
            if ! grep -q "com.google.android.gms.permission.AD_ID" "$MANIFEST"; then
              sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
            fi
          fi

          # Ensure Start.io In-App SDK dependency in build.gradle
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "com.startapp:inapp-sdk" "$BUILD_GRADLE"; then
              sed -i '/dependencies {/a \    implementation "com.startapp:inapp-sdk:5.1.0"' "$BUILD_GRADLE"
            fi
          fi

          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VDOSKy-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare Release APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VDOSKy.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VDOSKy App Release v1.0.${{ github.run_number }}
          body: "Direct download link for VDOSKy Android APK with Start.io Ads, Voice Search, Fullscreen Landscape, and 3000+ posts smooth scrolling."
          files: VDOSKy.apk
